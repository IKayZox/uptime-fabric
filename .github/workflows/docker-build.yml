name: Docker Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch the repository code
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t uptimefabric:ci .

